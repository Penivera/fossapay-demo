name: Bug report
description: Something in a demo or package is not working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [NairaBridge, SafeDeal, SquadPay, AjoSphere, fossapay-client, ui, webhook-gateway, docs]
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Sandbox (mock), Live]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Node version and OS
  - type: markdown
    attributes:
      value: "**Do not paste API keys, webhook secrets, BVN/NIN or full account numbers.**"
